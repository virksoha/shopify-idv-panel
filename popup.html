<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 220px; background: #030712; color: #e2e8f0; font-family: monospace; font-size: 12px; padding: 10px 12px; }
    .title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .title span { color: #3b82f6; }
    .open-btn {
      width: 100%; padding: 6px; border-radius: 5px; border: 1px solid #1d4ed8;
      background: #030d2d; color: #93c5fd; font-weight: 700; cursor: pointer; font-size: 11px;
      font-family: monospace; margin-bottom: 8px;
    }
    .open-btn:hover { background: #0a1a4f; }
    .store-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #0a0f1e; border: 1px solid #1e293b; border-radius: 4px;
      padding: 5px 8px; margin-bottom: 3px;
    }
    .store-name { color: #94a3b8; }
    .store-info { display: flex; align-items: center; gap: 6px; }
    .steps-count { color: #334155; font-size: 10px; }
    .dot-active { color: #f87171; font-weight: 700; }
    .dot-done { color: #4ade80; font-weight: 700; }
    .empty { color: #1e293b; font-size: 11px; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="title"><span>⬡</span> IDV Panel</div>
  <button class="open-btn" id="openBtn">Open Side Panel →</button>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>

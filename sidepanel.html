<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDV Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 100vh;
      background: #030712;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
      background: #0a0f1e;
    }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-title span { color: #3b82f6; }
    .header-store { font-size: 11px; color: #475569; margin-top: 2px; }
    .header-actions { display: flex; gap: 4px; }
    .btn-sm {
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #64748b;
      cursor: pointer;
      font-size: 10px;
      font-family: inherit;
    }
    .btn-sm:hover { background: #1e293b; color: #94a3b8; }
    .btn-sm.danger:hover { background: #450a0a; color: #f87171; border-color: #7f1d1d; }

    /* ── Main content ── */
    .content { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Status badge ── */
    .status-badge {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid;
      font-size: 11px;
      display: none;
    }
    .status-badge.active { display: block; background: #1a0505; border-color: #7f1d1d; color: #fca5a5; }
    .status-badge.discharged { display: block; background: #052005; border-color: #14532d; color: #86efac; }
    .status-badge .id { font-weight: 700; }
    .status-badge .label { margin-left: 8px; font-weight: 700; }

    /* ── Steps ── */
    .steps { display: flex; flex-direction: column; gap: 3px; }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #0f172a;
    }
    .step.done { border-color: #14532d; background: #052005; }
    .step.current { border-color: #1d4ed8; background: #030d2d; }
    .step.pending { border-color: #0f172a; }
    .step-icon { font-size: 14px; line-height: 1; margin-top: 1px; flex-shrink: 0; }
    .step.done .step-icon { color: #22c55e; }
    .step.current .step-icon { color: #60a5fa; }
    .step.pending .step-icon { color: #1e293b; }
    .step-body { flex: 1; }
    .step-label { font-weight: 700; }
    .step.done .step-label { color: #4ade80; }
    .step.current .step-label { color: #93c5fd; }
    .step.pending .step-label { color: #334155; }
    .step-hint { font-size: 10px; color: #475569; margin-top: 3px; line-height: 1.4; }

    /* ── Force verify button ── */
    .btn-force {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #1d4ed8;
      background: #030d2d;
      color: #93c5fd;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-force:hover { background: #0a1a4f; }
    .btn-force.visible { display: flex; }
    .btn-force.loading { opacity: 0.6; cursor: wait; }
    .btn-force.success { border-color: #14532d; background: #052005; color: #4ade80; }
    .btn-force.error { border-color: #7f1d1d; background: #1a0505; color: #f87171; }
    .force-error { font-size: 10px; color: #f87171; padding: 4px 2px; display: none; word-break: break-all; }
    .force-error.visible { display: block; }

    /* ── Submit to Stripe button ── */
    .btn-stripe {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #7c3aed;
      background: #13002e;
      color: #c4b5fd;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-stripe:hover { background: #1e0050; }
    .btn-stripe.visible { display: flex; }

    /* ── Documents section ── */
    .section-title {
      font-size: 10px;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .doc-slot {
      border: 1px dashed #1e293b;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      position: relative;
      background: #0a0f1e;
    }
    .doc-slot:hover { border-color: #3b82f6; background: #030d2d; }
    .doc-slot.has-file { border-color: #14532d; border-style: solid; background: #052005; }
    .doc-slot-label { font-size: 10px; color: #475569; margin-top: 4px; }
    .doc-slot.has-file .doc-slot-label { color: #4ade80; }
    .doc-slot-icon { font-size: 18px; }
    .doc-slot input[type="file"] { display: none; }
    .doc-preview {
      width: 100%;
      height: 40px;
      object-fit: cover;
      border-radius: 3px;
      display: none;
    }
    .doc-slot.has-file .doc-preview { display: block; }
    .doc-slot.has-file .doc-slot-icon { display: none; }

    .selfies-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }

    /* ── Captured tokens ── */
    .token-list { display: flex; flex-direction: column; gap: 3px; }
    .token-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a0f1e;
      border-radius: 5px;
      padding: 5px 8px;
    }
    .token-key { color: #475569; width: 80px; flex-shrink: 0; font-size: 10px; }
    .token-val { color: #cbd5e1; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token-copy {
      color: #334155;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .token-copy:hover { color: #3b82f6; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: #1e293b; }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-text { font-size: 11px; margin-bottom: 6px; }
    .empty-hint { font-size: 10px; color: #0f172a; }
    .empty-url { color: #1d4ed8; font-size: 11px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <div class="header-title"><span>⬡</span> IDV Panel</div>
    <div class="header-store" id="hdrStore">no store detected</div>
  </div>
  <div class="header-actions">
    <button class="btn-sm" id="btnExport" style="display:none">export</button>
    <button class="btn-sm danger" id="btnClear" style="display:none">✕</button>
  </div>
</div>

<div class="content">

  <!-- Restriction status -->
  <div class="status-badge" id="statusBadge">
    <span>Restriction </span>
    <span class="id" id="restrictionId">—</span>
    <span class="label" id="restrictionLabel">—</span>
  </div>

  <!-- Force PGRR button -->
  <div>
    <button class="btn-force" id="btnForce">▶ Force verify (PGRR)</button>
    <div class="force-error" id="forceError"></div>
  </div>

  <!-- Submit to Stripe button -->
  <button class="btn-stripe" id="btnStripe">🟣 Open Stripe & Auto Submit</button>

  <!-- Steps -->
  <div class="steps" id="steps"></div>

  <!-- Documents -->
  <div id="docsSection">
    <div class="section-title">Documents to submit</div>
    <div class="doc-grid">
      <label class="doc-slot" id="slotFront">
        <input type="file" accept="image/*" id="inputFront" />
        <div class="doc-slot-icon">🪪</div>
        <img class="doc-preview" id="prevFront" />
        <div class="doc-slot-label">DL Front</div>
      </label>
      <label class="doc-slot" id="slotBack">
        <input type="file" accept="image/*" id="inputBack" />
        <div class="doc-slot-icon">🪪</div>
        <img class="doc-preview" id="prevBack" />
        <div class="doc-slot-label">DL Back</div>
      </label>
    </div>
    <div style="margin-top:6px">
      <div class="section-title" style="margin-bottom:4px">Selfies (1–3)</div>
      <div class="selfies-grid">
        <label class="doc-slot" id="slotS0">
          <input type="file" accept="image/*" id="inputS0" />
          <div class="doc-slot-icon">🤳</div>
          <img class="doc-preview" id="prevS0" />
          <div class="doc-slot-label">Selfie 1</div>
        </label>
        <label class="doc-slot" id="slotS1">
          <input type="file" accept="image/*" id="inputS1" />
          <div class="doc-slot-icon">🤳</div>
          <img class="doc-preview" id="prevS1" />
          <div class="doc-slot-label">Selfie 2</div>
        </label>
        <label class="doc-slot" id="slotS2">
          <input type="file" accept="image/*" id="inputS2" />
          <div class="doc-slot-icon">🤳</div>
          <img class="doc-preview" id="prevS2" />
          <div class="doc-slot-label">Selfie 3</div>
        </label>
      </div>
    </div>
  </div>

  <!-- Captured tokens -->
  <div id="tokensSection" style="display:none">
    <div class="section-title">Captured</div>
    <div class="token-list" id="tokenList"></div>
  </div>

  <!-- Empty state -->
  <div class="empty" id="emptyState">
    <div class="empty-icon">⬡</div>
    <div class="empty-text">Navigate to Shopify admin</div>
    <div class="empty-url">admin.shopify.com/store/…</div>
    <div class="empty-hint" style="margin-top:8px">Data captured automatically</div>
  </div>

</div>

<script src="sidepanel.js"></script>
</body>
</html>
